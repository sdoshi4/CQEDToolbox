<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QubitTuneup Report</title>
    <style>
        body {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            font-family: sans-serif;
            line-height: 1.6;
        }

        h1 {
            border-bottom: 3px solid #333;
            padding-bottom: 10px;
        }

        h2 {
            margin-top: 30px;
        }

        /* Table of contents */
        .toc {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            list-style-position: inside;
        }

        .toc li {
            margin: 8px 0;
        }

        .toc a {
            text-decoration: none;
            color: #0066cc;
        }

        .toc a:hover {
            text-decoration: underline;
        }

        .toc-condition {
            font-style: italic;
            color: #666;
        }

        .toc-operation {
            font-weight: 500;
        }

        /* Sections */
        .report-section {
            margin: 40px 0;
            padding: 20px;
            background-color: #ffffff;
            border-left: 4px solid #ddd;
        }

        .report-section.condition {
            border-left-color: #ff9800;
            background-color: #fff8f0;
        }

        .report-section.operation {
            border-left-color: #2196f3;
            background-color: #f0f8ff;
        }

        .back-to-top {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #666;
            font-size: 14px;
        }

        .back-to-top:hover {
            color: #000;
        }

        /* Images and code */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
        }

        pre {
            background-color: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }

        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 40px 0;
        }

        /* Collapsible sections */
        .section-header {
            cursor: pointer;
            user-select: none;
            margin-top: 0;
        }

        .section-header:hover {
            opacity: 0.8;
        }

        .toggle-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        .section-content {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
    </style>
    <script>
        function initSections() {
            document.querySelectorAll('.section-content').forEach(function(el) {
                el.style.maxHeight = el.scrollHeight + 'px';
            });
        }

        function toggleSection(contentId) {
            const content = document.getElementById(contentId);
            const icon = content.previousElementSibling.querySelector('.toggle-icon');

            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.classList.remove('collapsed');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                requestAnimationFrame(function() {
                    content.classList.add('collapsed');
                    content.style.maxHeight = '0';
                    icon.classList.add('collapsed');
                });
            }
        }

        window.addEventListener('load', initSections);
    </script>
</head>
<body>
<h1>QubitTuneup Report</h1>

<h2>Table of Contents</h2>

<ul class='toc'>

  <li class='toc-operation'><a href='#section-0'>Operation: ResonatorSpectroscopyVsFlux</a></li>

</ul>

<hr>

<section id='section-0' class='report-section operation'>

<h2 class='section-header' onclick='toggleSection("section-0-content")'>

<span class='toggle-icon'>▼</span> Operation: ResonatorSpectroscopyVsFlux

</h2>

<div id='section-0-content' class='section-content'>


<a href='#' class='back-to-top'>↑ Back to top</a>

</div>

</section>

<hr>

</body>
</html>
